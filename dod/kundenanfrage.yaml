# FICTIONAL EXAMPLE: Definition of Done for customer requests in an invented team.
# Inherits dod/base.yaml. Raise `version` with every change of content.
type: kundenanfrage
version: 3
title: Kundenanfrage
extends: base
criteria:
  - id: FRIST
    text: Die erste Antwort ging innerhalb der vereinbarten Frist raus.
    check: evidence
    source: helpdesk.first_response
    expect: { field: first_response_at, not_after: due_at }
    fetch_with: [helpdesk:get_ticket]
  - id: VOLLSTAENDIG
    text: Die Antwort geht auf jede Frage der Anfrage ein.
    check: judgment
    question: Welche Frage der Anfrage bleibt in der Antwort offen?
    plausible_if:
      - Jede nummerierte Frage hat einen Absatz in der Antwort, der sie beantwortet.
    doubtful_if:
      - Eine Frage wird nur mit einem Verweis auf später beantwortet.
      - Die Antwort beantwortet eine Frage, die so nicht gestellt wurde.
  - id: WISSENSBASIS
    text: Eine neue Erkenntnis aus der Anfrage steht in der Wissensbasis.
    check: judgment
    question: Welche Erkenntnis aus dieser Anfrage würde der nächsten Person mit derselben Frage fehlen?
    plausible_if:
      - Ein Artikel in der Wissensbasis ist verlinkt oder es ist begründet, warum nichts Neues dabei war.
    doubtful_if:
      - Die Lösung steht nur in der Antwort an den Kunden.
  - id: ZUSAGE
    text: Zusagen zu Preis oder Termin sind freigegeben.
    check: attestation
    role: Vertrieb
    fetch_with: [helpdesk:get_ticket]
acceptance:
  template: |
    Fragen:
    1. <erste Frage aus der Anfrage, im Wortlaut>
    2. <weitere Frage>
    Frist: <TT.MM.JJJJ oder Dauer, z. B. 2 Arbeitstage>
  rules:
    - id: AK-FELDER
      kind: fields
      fields:
        - { name: Fragen, list: true, min_items: 1 }
        - { name: Frist, format: date_or_duration }
    - id: AK-VAGE-KA
      kind: vague_words
      words: [zeitnah, baldmöglichst, schnellstmöglich, asap]
